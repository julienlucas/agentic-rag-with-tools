[project]
name = "agentic-rag-docchat"
version = "0.1.0"
description = "Multi-agent AGENTIC RAG technique document chat system"
authors = [
    {name = "Julien Lucas", email = "contact@julienlucas.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.0.15",
    "django>=5.2.6",
    "django-cors-headers>=4.3.0",
    "langchain-community>=0.3.28",
    "langchain-core>=0.3.75",
    "langchain-classic>=0.1.0",
    "langchain-mistralai>=0.2.11",
    "langchain-text-splitters>=0.3.9",
    "langgraph>=0.6.6",
    "langsmith>=0.4.19",
    "loguru>=0.7.3",
    "mistralai>=1.9.9",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "rank-bm25>=0.2.2",
    "pypdf (>=6.6.0,<7.0.0)",
    "cohere>=5.20.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
