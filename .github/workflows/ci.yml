name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Clés factices : les tests n'appellent aucune API.
      MISTRALAI_API_KEY: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy
      COHERE_API_KEY: ci-dummy
      LANGSMITH_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --group dev
      # Gate minimal aujourd'hui (erreurs de syntaxe + noms non définis = ce qui a cassé
      # l'éval FinanceBench le 1er sept.). Passer à --select E,F quand E501/E402 sont traités.
      - run: uv run ruff check --select E9,F63,F7,F82 backend evaluation tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
